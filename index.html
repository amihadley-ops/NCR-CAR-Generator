<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bennett NCR / CAR Generator</title>
<style>
  :root { --sky:#0284c7; --sky-d:#0369a1; --violet:#7c3aed; --violet-d:#6d28d9; --line:#cbd5e1; --ink:#1e293b; --muted:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f1f5f9; color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-size:14px; }
  header.app { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border-bottom:1px solid #e2e8f0; }
  .bar { max-width:920px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; flex-wrap:wrap; }
  .bar .left { display:flex; align-items:center; gap:12px; }
  .bar img { height:32px; }
  .divider { width:1px; height:30px; background:#e2e8f0; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:9px; padding:2px; font-weight:600; }
  .toggle button { border:0; background:transparent; color:var(--muted); padding:5px 14px; border-radius:7px; cursor:pointer; font-weight:600; font-size:14px; }
  .toggle button.active { background:var(--sky); color:#fff; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; border-radius:9px; padding:7px 13px; font-weight:600; font-size:14px; cursor:pointer; border:1px solid transparent; }
  .btn-violet { background:var(--violet); color:#fff; } .btn-violet:hover { background:var(--violet-d); }
  .btn-sky { background:var(--sky); color:#fff; } .btn-sky:hover { background:var(--sky-d); }
  .btn-ghost { background:#fff; color:#334155; border-color:var(--line); } .btn-ghost:hover { background:#f8fafc; }
  .btn-track { background:#1B2A4A; color:#C9A227; } .btn-track:hover { background:#24365e; }
  .btn:disabled { opacity:.5; cursor:default; }
  main { max-width:920px; margin:0 auto; padding:22px 16px; }
  .subtitle { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; margin-bottom:14px; }
  .banner { display:flex; align-items:center; gap:8px; border-radius:9px; padding:9px 12px; font-size:14px; margin-bottom:14px; }
  .banner.err { background:#fef2f2; color:#b91c1c; } .banner.info { background:#f5f3ff; color:#6d28d9; }
  section.card { background:#fff; border:1px solid #e2e8f0; border-radius:13px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); margin-bottom:14px; }
  section.card h3 { margin:0 0 12px; font-size:14px; font-weight:700; }
  section.card h3 .cite { font-weight:400; font-style:italic; color:#94a3b8; font-size:11px; margin-left:6px; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media(min-width:640px){ .grid.two { grid-template-columns:1fr 1fr; } .wide { grid-column:1 / -1; } }
  label.f { display:flex; flex-direction:column; gap:4px; }
  label.f > span { font-size:12px; font-weight:600; color:#475569; }
  label.f > span .hint { font-weight:400; color:#94a3b8; margin-left:4px; }
  input, textarea { border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:14px; font-family:inherit; outline:none; resize:vertical; width:100%; }
  input:focus, textarea:focus { border-color:var(--sky); box-shadow:0 0 0 1px var(--sky); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:#fff; color:#475569; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:500; cursor:pointer; }
  .chip.on { border-color:var(--sky); background:#e0f2fe; color:var(--sky-d); }
  .rows { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:flex-start; gap:8px; }
  .row .cells { display:grid; gap:8px; flex:1; }
  .row .rm { margin-top:5px; border:0; background:transparent; color:#94a3b8; cursor:pointer; padding:5px; border-radius:6px; font-size:16px; line-height:1; }
  .row .rm:hover { background:#fef2f2; color:#ef4444; }
  .addrow { display:inline-flex; align-items:center; gap:4px; border:0; background:transparent; color:var(--sky-d); font-weight:600; font-size:12px; cursor:pointer; padding:2px 0; }
  .foot { text-align:center; color:#94a3b8; font-size:12px; padding:6px 0 40px; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

// docx builder — raw OOXML, zipped in-browser with no external dependencies
// =====================================================================
const TWIP = { full: 9360 }; // usable width for US Letter w/ 1" margins-ish

function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function para(text, opts = {}) {
  const { bold, size = 20, italic, color, align, spacingAfter = 60 } = opts;
  const runs = String(text ?? "").split("\n").map((line, i) => {
    const brk = i > 0 ? '<w:br/>' : "";
    return `<w:r><w:rPr>${bold ? "<w:b/>" : ""}${italic ? "<w:i/>" : ""}${color ? `<w:color w:val="${color}"/>` : ""}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr>${brk}<w:t xml:space="preserve">${esc(line)}</w:t></w:r>`;
  }).join("");
  return `<w:p><w:pPr><w:spacing w:after="${spacingAfter}"/>${align ? `<w:jc w:val="${align}"/>` : ""}</w:pPr>${runs}</w:p>`;
}

function sectionHeading(text, cite) {
  return `<w:p><w:pPr><w:spacing w:before="180" w:after="60"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="22"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>${cite ? `<w:r><w:rPr><w:i/><w:sz w:val="16"/><w:color w:val="666666"/></w:rPr><w:t xml:space="preserve">  ${esc(cite)}</w:t></w:r>` : ""}</w:p>`;
}

function cell(content, widthTwip, opts = {}) {
  const { shade, bold, size = 20 } = opts;
  const body = Array.isArray(content)
    ? content.map((c) => para(c.text, { bold: c.bold ?? bold, size })).join("")
    : para(content, { bold, size, spacingAfter: 20 });
  return `<w:tc><w:tcPr><w:tcW w:w="${widthTwip}" w:type="dxa"/>${shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${shade}"/>` : ""}<w:tcMar><w:top w:w="40" w:type="dxa"/><w:left w:w="80" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tcMar><w:vAlign w:val="center"/></w:tcPr>${body || para("", { size })}</w:tc>`;
}

function table(rows, colWidths) {
  const total = colWidths.reduce((a, b) => a + b, 0);
  const grid = colWidths.map((w) => `<w:gridCol w:w="${w}"/>`).join("");
  const body = rows.map((r) =>
    `<w:tr>${r.map((c, i) => cell(c.content, colWidths[i], c)).join("")}</w:tr>`
  ).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map((s)=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="999999"/>`).join("")}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${body}</w:tbl>`;
}

function labelValueTable(pairs) {
  const L = 3000, R = TWIP.full - L;
  return table(
    pairs.map(([l, v]) => [
      { content: l, bold: true, shade: "F2F2F2" },
      { content: v || "" },
    ]),
    [L, R]
  );
}

function buildDocumentXml(kind, s) {

  parts.push(

  );

  // header grid (6 col: label,val,label,val,label,val) — mirror template
  const h = s.header;
  const hw = [1400, 1720, 1560, 1560, 1360, 1760];
  const hrow = (a, b, c, d, e, f) => [
    { content: a, bold: true, shade: "F2F2F2" }, { content: h[b] || "" },
    { content: c, bold: true, shade: "F2F2F2" }, { content: h[d] || "" },
    { content: e, bold: true, shade: "F2F2F2" }, { content: h[f] || "" },
  ];
  parts.push(table([
    hrow(isCAR ? "CAR #" : "NCR #", "ncr", "Date", "date", "Customer", "customer"),
    // second row: Part / BHT / PO — but template puts PO top-right; keep customer/spec/proc ordering close
  ], hw));
  // Simpler: rebuild the exact header layout in one table
  parts.pop();
  parts.push(table([
    [
      { content: isCAR ? "CAR #" : "NCR #", bold: true, shade: "F2F2F2" }, { content: h.ncr },
      { content: "Date", bold: true, shade: "F2F2F2" }, { content: h.date },
      { content: "Customer", bold: true, shade: "F2F2F2" }, { content: h.customer },
      { content: "PO #", bold: true, shade: "F2F2F2" }, { content: h.po },
    ],
    [
      { content: "Part No.", bold: true, shade: "F2F2F2" }, { content: h.part },
      { content: "BHT #", bold: true, shade: "F2F2F2" }, { content: h.bht },
      { content: "Spec(s)", bold: true, shade: "F2F2F2" }, { content: h.spec },
      { content: "Process", bold: true, shade: "F2F2F2" }, { content: h.process },
    ],
    [
      { content: "Detected By", bold: true, shade: "F2F2F2" }, { content: h.detectedBy },
      { content: "Stage", bold: true, shade: "F2F2F2" }, { content: h.stage },
      { content: "Location", bold: true, shade: "F2F2F2" }, { content: h.location },
      { content: "Ref (WO/Trav)", bold: true, shade: "F2F2F2" }, { content: h.reference },
    ],
  ], [1250, 1090, 1090, 1090, 1180, 1090, 1490, 1090]));

  let n = 0;
  const next = () => ++n;

  // 1) Description
  parts.push(sectionHeading(`${next()}) Description of ${isCAR ? "Issue" : "Nonconformance"}`, isCAR ? "(AS9100 10.2; 8.7, NADCAP AC7004)" : "(AS9100 8.7; Nadcap AC7004)"));
  if (isCAR) {
    parts.push(para(s.actualCondition || "", { size: 20 }));
  } else {
    parts.push(table([
      [{ content: "Requirement", bold: true, shade: "F2F2F2" }, { content: "Actual Condition / Evidence", bold: true, shade: "F2F2F2" }, { content: "Records/Attachments", bold: true, shade: "F2F2F2" }],
      [{ content: s.requirement }, { content: s.actualCondition }, { content: (s.records[0] && s.records[0].ref) || "" }],
    ], [3120, 3120, 3120]));
    if (s.qtyAffected || s.serialLot) {
      parts.push(labelValueTable([
        ["Quantity Affected", s.qtyAffected],
        ["Serial / Lot Range", s.serialLot],

  }

  // 2) Containment
  parts.push(sectionHeading(`${next()}) Immediate Containment${isCAR ? " Actions" : " & Segregation"}`, isCAR ? "(AS9100 8.7.1, NADCAP AC7004)" : "(AS9100 8.7.1; 8.1.3)"));

      ["Date Implemented", s.containmentDate],
      ["Responsible Person", s.containmentOwner],

  } else {
    parts.push(labelValueTable([

      ["Customer Notified (Y/N & date)", s.customerNotified],

  // NCR disposition
  if (!isCAR) {
    parts.push(sectionHeading(`${next()}) Disposition`, "(AS9100 8.7.1)"));
    parts.push(table([
      [{ content: "Disposition", bold: true, shade: "F2F2F2" }, { content: "Authority/Approval", bold: true, shade: "F2F2F2" }, { content: "Rationale/Notes", bold: true, shade: "F2F2F2" }],
      ...DISPOSITIONS.map((d) => [

        { content: s.disposition === d ? s.dispositionAuthority : "" },
        { content: s.disposition === d ? s.dispositionRationale : "" },

    ], [3120, 3120, 3120]));
  }

  // RCA
  parts.push(sectionHeading(`${next()}) Root Cause Analysis`, "(AS9100 10.2; Nadcap AC7004)"));
  parts.push(para("Structured method (5-Whys / Fishbone). Identify systemic cause, not just symptom.", { italic: true, size: 18, color: "666666" }));
  parts.push(labelValueTable([
    ["Problem Statement", s.problem],
    ...s.whys.map((w, i) => [`Why ${i + 1}?`, w]),

  // Corrective action plan (CAR only)
  if (isCAR) {
    parts.push(sectionHeading(`${next()}) Corrective Action Plan`, "(AS9100 10.2.1)"));
    parts.push(table([
      [{ content: "Action", bold: true, shade: "F2F2F2" }, { content: "Owner", bold: true, shade: "F2F2F2" }, { content: "Due Date", bold: true, shade: "F2F2F2" }],
      ...s.correctiveActions.map((a) => [{ content: a.action }, { content: a.owner }, { content: a.due }]),

  // Preventive
  parts.push(sectionHeading(`${next()}) ${isCAR ? "Preventive Action" : "Preventive/Systemic Actions"}`, isCAR ? "(AS9100 10.2.1 f,g)" : "(AS9100 10.2.1; 8.1.2)"));
  parts.push(table([
    [{ content: isCAR ? "Preventive Action" : "Process/Procedure/Training change", bold: true, shade: "F2F2F2" }, { content: "Document No./Rev", bold: true, shade: "F2F2F2" }, { content: "Effective Date", bold: true, shade: "F2F2F2" }],
    ...s.preventive.map((p) => [{ content: p.action }, { content: p.docRev }, { content: p.effective }]),
  ], [4680, 2340, 2340]));

  // Verification
  parts.push(sectionHeading(`${next()}) Effectiveness Verification`, isCAR ? "(AS9100 10.2.1, NADCAP AC7004)" : "(AS9100 10.2.1 h)"));
  parts.push(labelValueTable([
    ["Verification Method", s.verifyMethod],
    ["Results / Evidence", s.verifyResults],
    ["Verified By & Date", s.verifyBy],
  ]));

  // Records
  parts.push(sectionHeading(`${next()}) Records & Attachments`, isCAR ? "(AS9100 7.5)" : "(AS9100 7.5; Nadcap AC7004)"));
  parts.push(table([
    [{ content: "Record Type", bold: true, shade: "F2F2F2" }, { content: "Reference/ID", bold: true, shade: "F2F2F2" }],
    ...s.records.map((r) => [{ content: r.type }, { content: r.ref }]),
  ], [4680, 4680]));

  // Notes
  parts.push(sectionHeading(`${next()}) Notes`, ""));
  parts.push(para(s.notes || "", { size: 20 }));

  // Approvals
  parts.push(sectionHeading(`${next()}) Approvals & Closure`, ""));
  parts.push(labelValueTable([
    ["Prepared By", ""],
    ["Quality Approval", ""],
    ["Customer Approval (if required)", ""],
    ...(isCAR ? [] : [["Final Closure", ""]]),
  ]));

  const sectPr = `<w:sectPr><w:footerReference w:type="default" r:id="rId101"/><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><w:body>${parts.join("")}${sectPr}</w:body></w:document>`;
}

// ---- self-contained ZIP writer (store method, no compression, no CDN) ----
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function strBytes(s) { return new TextEncoder().encode(s); }
function b64ToUint8(b64) {
  const clean = String(b64).replace(/[^A-Za-z0-9+/=]/g, "");
  const bin = atob(clean);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function deflateRaw(bytes) {
  if (typeof CompressionStream !== "undefined") {
    try {
      const cs = new CompressionStream("deflate-raw");
      const stream = new Blob([bytes]).stream().pipeThrough(cs);
      const buf = await new Response(stream).arrayBuffer();
      return new Uint8Array(buf);
    } catch (e) { /* fall through to stored */ }
  }
  return null; // signals: store this entry
}

async function makeZip(files) {
  const chunks = [], central = [];
  let offset = 0;
  const enc = new TextEncoder();
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const raw = f.data;
    const crc = crc32(raw), usize = raw.length;
    let comp = await deflateRaw(raw);
    let method = 8;
    if (!comp) { comp = raw; method = 0; } // fallback to stored if no CompressionStream
    const csize = comp.length;
    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true); dv.setUint16(8, method, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, csize, true);
    dv.setUint32(22, usize, true); dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true); lh.set(nameBytes, 30);
    chunks.push(lh, comp);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true); cv.setUint16(8, 0, true);
    cv.setUint16(10, method, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x21, true); cv.setUint32(16, crc, true);
    cv.setUint32(20, csize, true); cv.setUint32(24, usize, true);
    cv.setUint16(28, nameBytes.length, true); cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true); cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true); cd.set(nameBytes, 46);
    central.push(cd);
    offset += lh.length + comp.length;
  }
  const cdStart = offset;
  let cdSize = 0;
  for (const c of central) { chunks.push(c); cdSize += c.length; }
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true); ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdStart, true);
  chunks.push(eocd);
  let total = 0; for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let p = 0; for (const c of chunks) { out.set(c, p); p += c.length; }
  return out;
}

  }

    .free { border:1px solid #999; min-height:40px; padding:5px; margin:2px 0 4px; }
    .foot { position:fixed; bottom:0.3in; left:0.6in; font-size:8pt; color:#777; }

  ${body}
  <div class="foot">${esc2(footer)}</div>
  </body></html>`;

  // Print via a hidden in-page iframe so no popup window is needed (avoids popup blocker).

  const iframe = document.createElement("iframe");
  iframe.id = "__print_frame__";
  iframe.setAttribute("aria-hidden", "true");
  iframe.style.position = "fixed";
  iframe.style.right = "0";
  iframe.style.bottom = "0";

      const win = iframe.contentWindow;
      if (!win) {
        errMsg = "Your browser blocked the print view. Use the Word export instead.";
        render();
        return;
      }
      try {
        win.focus();
        win.print();
      } catch (e) {
        errMsg = "Couldn't open the print dialog. Use the Word export instead. (" + (e.message || e) + ")";
        render();
      }
    }, 350);
  };
  iframe.srcdoc = html;
  document.body.appendChild(iframe);
}

const $ = (tag, attrs = {}, kids = []) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach((c) => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
};

function field(label, value, onInput, opts = {}) {
  const input = opts.area
    ? $("textarea", { rows: opts.area })
    : $("input", { type: "text" });
  input.value = value || "";
  input.addEventListener("input", (e) => onInput(e.target.value));
  const span = $("span", {}, [label]);
  if (opts.hint) span.appendChild($("span", { class: "hint" }, [`(${opts.hint})`]));
  const lab = $("label", { class: "f" + (opts.wide ? " wide" : "") }, [span, input]);
  return lab;
}

function rowEditor(listKey, cols) {
  const wrap = $("div", { class: "rows" });
  state[listKey].forEach((row, i) => {
    const cells = $("div", { class: "cells" });
    cells.style.gridTemplateColumns = cols.map((c) => (c[2] ? "2fr" : "1fr")).join(" ");
    cols.forEach(([f, label]) => {
      const inp = $("input", { type: "text", placeholder: label });
      inp.value = row[f] || "";
      inp.addEventListener("input", (e) => { state[listKey][i][f] = e.target.value; });
      cells.appendChild(inp);
    });
    const rm = $("button", { class: "rm", title: "Remove row", onclick: () => {
      if (state[listKey].length === 1) return;
      state[listKey].splice(i, 1); render();
    } }, ["\u2715"]);
    if (state[listKey].length === 1) rm.disabled = true;
    wrap.appendChild($("div", { class: "row" }, [cells, rm]));
  });
  const blank = Object.fromEntries(cols.map((c) => [c[0], ""]));
  wrap.appendChild($("button", { class: "addrow", onclick: () => { state[listKey].push({ ...blank }); render(); } }, ["+ Add row"]));

// ---- Load from Word: read a completed generator .docx back into the form ----
// Uses native DecompressionStream so it works fully offline (no libraries).
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readDocxEntry(fileBytes, wantName) {
  const dv = new DataView(fileBytes.buffer, fileBytes.byteOffset, fileBytes.byteLength);
  const dec = new TextDecoder();
  let off = 0;
  while (off + 4 <= fileBytes.length) {
    if (dv.getUint32(off, true) !== 0x04034b50) break;
    const method = dv.getUint16(off + 8, true);
    const csize = dv.getUint32(off + 18, true);
    const nlen = dv.getUint16(off + 26, true);
    const elen = dv.getUint16(off + 28, true);
    const name = dec.decode(fileBytes.subarray(off + 30, off + 30 + nlen));
    const dataStart = off + 30 + nlen + elen;
    const comp = fileBytes.subarray(dataStart, dataStart + csize);
    if (name === wantName) return method === 0 ? comp : await inflateRaw(comp);
    off = dataStart + csize;
  }
  throw new Error("word/document.xml not found — is this a Word file?");
}
function unescapeXml(s) {
  return s.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n));
}
function parseDocxTables(xml) {
  const tables = [];
  const tbls = xml.match(/<w:tbl>[\s\S]*?<\/w:tbl>/g) || [];
  for (const tblXml of tbls) {
    const rows = [];
    const trs = tblXml.match(/<w:tr\b[\s\S]*?<\/w:tr>/g) || [];
    for (const trXml of trs) {
      const cells = [];
      const tcs = trXml.match(/<w:tc\b[\s\S]*?<\/w:tc>/g) || [];
      for (const tcXml of tcs) {
        const texts = [...tcXml.matchAll(/<w:t\b[^>]*>([\s\S]*?)<\/w:t>/g)].map((x) => unescapeXml(x[1]));
        cells.push(texts.join("").trim());
      }
      if (cells.length) rows.push(cells);
    }
    tables.push(rows);
  }
  return tables;
}
async function loadFromWord(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const xml = new TextDecoder().decode(await readDocxEntry(bytes, "word/document.xml"));
  const tables = parseDocxTables(xml);
  if (!tables.length) throw new Error("No tables found — not a generator form?");

  // detect kind from the title text
  const isCar = /Corrective Action Report/i.test(xml);
  const k = isCar ? "CAR" : "NCR";

  const grid = tables[0].flat();
  const hmap = {};
  for (let i = 0; i < grid.length; i += 2) if (grid[i]) hmap[grid[i].toLowerCase()] = grid[i + 1] || "";
  const H = (key) => { key = key.toLowerCase(); for (const kk in hmap) { if (kk.startsWith(key)) return hmap[kk]; } return ""; };
  const findT = (label) => tables.find((t) => t.length && (t[0][0] || "").toLowerCase().includes(label.toLowerCase()));

  // start clean for the detected kind, keep nothing stale
  kind = k;
  state = blankState(k);

  // header
  state.header.ncr = H("ncr #") || H("car #");
  state.header.date = H("date");
  state.header.customer = H("customer");
  state.header.po = H("po");
  state.header.part = H("part no");
  state.header.bht = H("bht");
  state.header.spec = H("spec");
  state.header.process = H("process");
  state.header.detectedBy = H("detected");
  state.header.stage = H("stage");
  state.header.location = H("location");
  state.header.reference = H("ref");

  // description
  const reqT = findT("requirement");
  if (isCar) {
    state.actualCondition = firstParaAfter(xml, "Description of Issue");
  } else if (reqT && reqT.length > 1) {
    state.requirement = reqT[1][0] || "";
    state.actualCondition = reqT[1][1] || "";
  }

  // qty / serial
  const qtyT = findT("quantity affected");
  if (qtyT) {
    const q = qtyT.find((r) => /quantity affected/i.test(r[0] || ""));
    const s = qtyT.find((r) => /serial/i.test(r[0] || ""));
    if (q) state.qtyAffected = q[1] || "";
    if (s) state.serialLot = s[1] || "";
  }

  // containment
  const contCar = findT("containment action");
  const contNcr = findT("hold/segregation");
  if (isCar && contCar) {
    contCar.forEach((r) => {
      if (/containment action/i.test(r[0])) state.containment = r[1] || "";
      if (/date implemented/i.test(r[0])) state.containmentDate = r[1] || "";
      if (/responsible/i.test(r[0])) state.containmentOwner = r[1] || "";
    });
  } else if (contNcr) {
    contNcr.forEach((r) => {
      if (/hold\/segregation/i.test(r[0])) state.holdMethod = r[1] || "";
      if (/customer notified/i.test(r[0])) state.customerNotified = r[1] || "";
    });
  }

  // disposition (NCR)
  const dispT = findT("disposition");
  if (dispT) for (const r of dispT) {
    if (/[\u2612\u2611\u2713\u2714]/.test(r[0] || "")) {
      state.disposition = r[0].replace(/[\u2610\u2612\u2611\u2713\u2714]/g, "").trim();
      state.dispositionAuthority = r[1] || "";
      state.dispositionRationale = r[2] || "";
      break;
    }
  }

  // RCA
  const whyT = findT("problem statement");
  if (whyT) {
    state.problem = whyT[0][1] || "";
    const w = ["", "", "", "", ""];
    whyT.forEach((r) => { const m = (r[0] || "").toLowerCase().match(/why\s*(\d)/); if (m) w[+m[1] - 1] = r[1] || ""; });
    state.whys = w;
  }

  // corrective actions (CAR) — match the table whose header is Action / Owner / Due Date
  const capT = tables.find((t) => t.length && (t[0][0] || "").toLowerCase() === "action" && /owner/i.test(t[0][1] || ""));
  if (isCar && capT && capT.length > 1) {
    state.correctiveActions = capT.slice(1).filter((r) => (r[0] || r[1] || r[2] || "").trim())
      .map((r) => ({ action: r[0] || "", owner: r[1] || "", due: r[2] || "" }));
    if (!state.correctiveActions.length) state.correctiveActions = [{ action: "", owner: "", due: "" }];
  }

  // preventive
  const prevT = findT("preventive action") || findT("process/procedure");
  if (prevT && prevT.length > 1) {
    state.preventive = prevT.slice(1).filter((r) => (r[0] || r[1] || r[2] || "").trim())
      .map((r) => ({ action: r[0] || "", docRev: r[1] || "", effective: r[2] || "" }));
    if (!state.preventive.length) state.preventive = [{ action: "", docRev: "", effective: "" }];
  }

  // verification
  const verT = findT("verification method");
  if (verT) verT.forEach((r) => {
    if (/verification method/i.test(r[0])) state.verifyMethod = r[1] || "";
    if (/results/i.test(r[0])) state.verifyResults = r[1] || "";
    if (/verified by/i.test(r[0])) state.verifyBy = r[1] || "";
  });

  // records
  const recT = findT("record type");
  if (recT && recT.length > 1) {
    state.records = recT.slice(1).filter((r) => (r[0] || r[1] || "").trim())
      .map((r) => ({ type: r[0] || "", ref: r[1] || "" }));
    if (!state.records.length) state.records = [{ type: "", ref: "" }];
  }

  render();
}
function firstParaAfter(xml, heading) {
  const idx = xml.indexOf(heading);
  if (idx < 0) return "";
  // start just past the heading text so we don't re-read the heading paragraph
  const after = xml.slice(idx + heading.length);
  const paras = [...after.matchAll(/<w:p\b[\s\S]*?<\/w:p>/g)];
  for (let i = 0; i < paras.length; i++) {
    const texts = [...paras[i][0].matchAll(/<w:t\b[^>]*>([\s\S]*?)<\/w:t>/g)].map((x) => unescapeXml(x[1]));
    const t = texts.join("").trim();
    if (!t) continue;
    if (/^\d\)\s/.test(t)) break; // hit the next numbered section — description was empty
    return t;
  }
  return "";
}
async function runLoadWord(input) {
  const file = input.files[0]; input.value = "";
  if (!file) return;
  errMsg = ""; busy = true; busyMsg = "Reading Word form\u2026"; render();
  try {
    await loadFromWord(file);
    busyMsg = "Loaded \u2014 review the fields, then export or send to tracker."; render();
    setTimeout(() => { busyMsg = ""; render(); }, 3500);
  } catch (e) {
    errMsg = "Couldn't read that file: " + (e.message || e) + " \u2014 make sure it's a Word form made by this generator.";
    render();
  } finally { busy = false; }
}

function runPdf() {
  errMsg = "";
  try { exportPdf(kind, state); }
  catch (e) { errMsg = "PDF export failed: " + (e.message || e); render(); }
}

// ---- Send to tracker: write a .ncrcar file the tracker imports as one row ----
// Field shape matches what the tracker's parser produces, so its existing
// add-row logic maps everything (including the 5-Why chain) with no drift.
function exportTracker(kind, state) {
  const h = state.header;
  const whys = [...state.whys.slice(0, 5)];
  whys[5] = [...whys].reverse().find((x) => x && x.trim()) || "";
  const rec = {
    kind: kind.toLowerCase(),
    header: {
      "NCR #": h.ncr || "",
      "Date": h.date || "",
      "Customer": h.customer || "",
      "PO #": h.po || "",
      "Part No.": h.part || "",
      "Process": h.process || "",
    },
    description: state.actualCondition || state.requirement || "",
    qty: state.qtyAffected || "",
    disposition: state.disposition || "",
    containment: state.containment || state.holdMethod || "",
    problem: state.problem || "",
    whys: whys,
  };
  const blob = new Blob([JSON.stringify(rec, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const id = state.header.ncr || state.header.bht || "draft";
  a.href = url;
  a.download = `${kind}_${id}`.replace(/[^\w.-]+/g, "_") + ".ncrcar";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function runTracker() {
  errMsg = "";
  try {
    exportTracker(kind, state);
    busyMsg = "Saved a tracker file \u2014 open the tracker and use \u201cImport from Generator.\u201d"; render();
    setTimeout(() => { busyMsg = ""; render(); }, 4000);
  } catch (e) { errMsg = "Send to tracker failed: " + (e.message || e); render(); }
}

function switchKind(k) {
  kind = k;
  const keepHeader = state.header;
  state = blankState(k);
  state.header = keepHeader;
  render();
}

function render() {
  const isCAR = kind === "CAR";
  const root = document.getElementById("root");
  root.innerHTML = "";

  // header bar
  const toggle = $("div", { class: "toggle" }, ["NCR", "CAR"].map((k) =>
    $("button", { class: kind === k ? "active" : "", onclick: () => switchKind(k) }, [k])));
  const wordBtn = $("button", { class: "btn btn-sky", onclick: runExport }, [
    busy && busyMsg.startsWith("Build") ? $("span", { class: "spin" }) : "\u2193", " Word"]);
  const pdfBtn = $("button", { class: "btn btn-ghost", onclick: runPdf }, ["\uD83D\uDCC4 PDF"]);
  const trackBtn = $("button", { class: "btn btn-track", onclick: runTracker }, ["\u21A6 Send to tracker"]);
  const loadInput = $("input", { type: "file", accept: ".docx", id: "__load_word__", style: "display:none" });
  loadInput.addEventListener("change", (e) => runLoadWord(e.target));
  const loadBtn = $("button", { class: "btn btn-ghost", onclick: () => loadInput.click() }, [
    busy && busyMsg.startsWith("Reading") ? $("span", { class: "spin" }) : "\u2191", " Load from Word"]);
  if (busy) { wordBtn.disabled = true; pdfBtn.disabled = true; trackBtn.disabled = true; loadBtn.disabled = true; }

  const logo = $("img", { src: "data:image/jpeg;base64," + LOGO_B64, alt: "Bennett" });
  const bar = $("div", { class: "bar" }, [
    $("div", { class: "left" }, [logo, $("div", { class: "divider" }), toggle]),
    $("div", { class: "actions" }, [loadBtn, wordBtn, pdfBtn, trackBtn, loadInput]),
  ]);
  root.appendChild($("header", { class: "app" }, [bar]));

  const main = $("main", {});
  main.appendChild($("div", { class: "subtitle" }, ["\uD83D\uDCC4 " + (isCAR ? "Corrective Action Report" : "Nonconformance Report") + " \u2014 fill in the fields, then export to Word or PDF."]));

  if (busyMsg || errMsg) {
    main.appendChild($("div", { class: "banner " + (errMsg ? "err" : "info") }, [
      errMsg ? "\u26A0 " : "", errMsg || busyMsg]));
  }

  // Header card
  const hgrid = $("div", { class: "grid two" });
  HEADER_FIELDS.forEach((f) => {
    const label = (f.key === "ncr" && isCAR) ? "CAR #" : f.label;
    hgrid.appendChild(field(label, state.header[f.key], (v) => { state.header[f.key] = v; }, { hint: f.hint }));
  });
  main.appendChild(card("Header", "", [hgrid]));

  let n = 0; const next = () => ++n;

  // 1) Description
  {
    const g = $("div", { class: "grid two" });
    if (!isCAR) g.appendChild(field("Requirement", state.requirement, (v) => state.requirement = v, { area: 2, wide: true }));
    g.appendChild(field(isCAR ? "Description of issue" : "Actual condition / evidence", state.actualCondition, (v) => state.actualCondition = v, { area: 3, wide: true }));
    g.appendChild(field("Qty affected", state.qtyAffected, (v) => state.qtyAffected = v));
    g.appendChild(field("Serial / lot range", state.serialLot, (v) => state.serialLot = v));
    main.appendChild(card(`${next()}) Description of ${isCAR ? "Issue" : "Nonconformance"}`, isCAR ? "AS9100 10.2; 8.7 \u00b7 AC7004" : "AS9100 8.7 \u00b7 AC7004", [g]));
  }

  // 2) Containment
  {
    const g = $("div", { class: "grid two" });
    g.appendChild(field(isCAR ? "Containment action" : "Hold / segregation method", isCAR ? state.containment : state.holdMethod, (v) => { if (isCAR) state.containment = v; else state.holdMethod = v; }, { area: 2, wide: true }));
    if (isCAR) {
      g.appendChild(field("Date implemented", state.containmentDate, (v) => state.containmentDate = v));
      g.appendChild(field("Responsible person", state.containmentOwner, (v) => state.containmentOwner = v));
    } else {
      g.appendChild(field("Customer notified (Y/N & date)", state.customerNotified, (v) => state.customerNotified = v, { wide: true }));
    }
    main.appendChild(card(`${next()}) Immediate Containment${isCAR ? " Actions" : " & Segregation"}`, isCAR ? "AS9100 8.7.1 \u00b7 AC7004" : "AS9100 8.7.1; 8.1.3", [g]));
  }

  // NCR disposition
  if (!isCAR) {
    const chips = $("div", { class: "chips" }, DISPOSITIONS.map((d) =>
      $("button", { class: "chip" + (state.disposition === d ? " on" : ""), onclick: () => { state.disposition = state.disposition === d ? "" : d; render(); } }, [(state.disposition === d ? "\u2611 " : "\u2610 ") + d])));
    const nodes = [chips];
    if (state.disposition) {
      const g = $("div", { class: "grid two" });
      g.style.marginTop = "12px";
      g.appendChild(field("Authority / approval", state.dispositionAuthority, (v) => state.dispositionAuthority = v));
      g.appendChild(field("Rationale / notes", state.dispositionRationale, (v) => state.dispositionRationale = v));
      nodes.push(g);
    }
    main.appendChild(card(`${next()}) Disposition`, "AS9100 8.7.1", nodes));
  }

  // RCA
  {
    const g = $("div", { class: "grid" });
    g.appendChild(field("Problem statement", state.problem, (v) => state.problem = v, { wide: true }));
    state.whys.forEach((w, i) => g.appendChild(field(`Why ${i + 1}?`, w, (v) => state.whys[i] = v, { wide: true })));
    main.appendChild(card(`${next()}) Root Cause Analysis`, "AS9100 10.2 \u00b7 AC7004 \u00b7 5-Why", [g]));
  }

  // CAP (CAR)
  if (isCAR) {
    main.appendChild(card(`${next()}) Corrective Action Plan`, "AS9100 10.2.1", [
      rowEditor("correctiveActions", [["action", "Action", true], ["owner", "Owner"], ["due", "Due date"]])]));
  }

  // Preventive
  main.appendChild(card(`${next()}) ${isCAR ? "Preventive Action" : "Preventive / Systemic Actions"}`, isCAR ? "AS9100 10.2.1 f,g" : "AS9100 10.2.1; 8.1.2", [
    rowEditor("preventive", [["action", isCAR ? "Preventive action" : "Process/procedure/training change", true], ["docRev", "Doc No./Rev"], ["effective", "Effective date"]])]));

  // Verification
  {
    const g = $("div", { class: "grid two" });
    g.appendChild(field("Verification method", state.verifyMethod, (v) => state.verifyMethod = v, { area: 2, wide: true }));
    g.appendChild(field("Results / evidence", state.verifyResults, (v) => state.verifyResults = v));
    g.appendChild(field("Verified by & date", state.verifyBy, (v) => state.verifyBy = v));
    main.appendChild(card(`${next()}) Effectiveness Verification`, isCAR ? "AS9100 10.2.1 \u00b7 AC7004" : "AS9100 10.2.1 h", [g]));
  }

  // Records
  main.appendChild(card(`${next()}) Records & Attachments`, "AS9100 7.5", [
    rowEditor("records", [["type", "Record type"], ["ref", "Reference / ID"]])]));

  // Notes
  main.appendChild(card(`${next()}) Notes`, "", [field("", state.notes, (v) => state.notes = v, { area: 3, wide: true })]));

  main.appendChild($("p", { class: "foot" }, [
    (isCAR ? "CAR Form Rev A, dated 12.18.2025" : "NCR Form Rev 4, dated 12.18.2025") + " \u00b7 Approvals block is added to the export for signature."]));

  root.appendChild(main);
}

render();

</script>
